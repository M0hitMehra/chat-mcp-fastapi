[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "M0hitMehra", email = "786Hitmen@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "langchain==1.3.14",
    "langchain-google-genai>=4.3.1",
    "langchain-mcp-adapters==0.3.0",
    "langgraph>=1.2.9",
    "mcp==1.29.0",
    "pydantic==2.13.4",
